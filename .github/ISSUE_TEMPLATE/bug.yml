name: Ошибка
description: Что-то работает не так, как ожидалось
title: "Bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Где проявляется
      options:
        - Бэкенд
        - Фронтенд
        - Инфраструктура
        - Документация
        - Другое
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что произошло
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Окружение
      description: Система, версии, ветка или коммит, где ошибка видна.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Логи и скриншоты
      description: Не вставляй пароли, токены и персональные данные.
    validations:
      required: false