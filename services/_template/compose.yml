name: kiro-template

services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
        db:
            condition: service_healthy


  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiro_template
      POSTGRES_USER: kiro
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
        interval: 10s
        timeout: 3s
        retries: 10

volumes:
  postgres_data:
